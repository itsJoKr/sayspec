<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon: 824px tile on a 1024px canvas (Apple icon grid), SaySpec [•] mark from the website favicon. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F3"/>
      <stop offset="1" stop-color="#ECE8DF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#202522" stroke-opacity="0.08"/>
  <g transform="translate(512 512) scale(11.25) translate(-32 -32)">
    <path d="M24 13h-9v38h9M40 13h9v38h-9" fill="none" stroke="#202522" stroke-width="5" stroke-linejoin="miter"/>
