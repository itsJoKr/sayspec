<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Fieldnote Market — everyday goods, thoughtfully sourced</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Fieldnote Market home">
        <span class="wordmark-mark" aria-hidden="true">f.</span>
        <span>fieldnote<span class="wordmark-light"> market</span></span>
      </a>
      <p class="header-note">Good things, close to home.</p>
      <button class="cart-link" type="button" data-testid="cart-button" aria-label="Open cart, 0 items">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
        <span>Cart</span><span class="cart-count" data-testid="cart-count">0</span>
      </button>
    </header>

    <main id="app" class="page-shell" aria-live="polite"></main>

    <footer class="site-footer">
      <span>Fieldnote Market</span>
      <span>Small rituals. Better days.</span>
    </footer>
  </body>
</html>
